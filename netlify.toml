# Netlify configuration for Worth Their Weight
#
# Domain redirects: forward the wtwvets.org alias (apex + www) to the
# canonical primary domain, worththeirweight.org. Path and query string are
# preserved via :splat, so deep links like /carrytheweight redirect correctly.
# force = true ensures the redirect wins even though the site is also served
# at these aliases.

[[redirects]]
  from = "https://wtwvets.org/*"
  to = "https://worththeirweight.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.wtwvets.org/*"
  to = "https://worththeirweight.org/:splat"
  status = 301
  force = true

# Live impact numbers. The site calls /api/impact; Netlify fetches the totals
# from the Roster's public feed (counts and sums only, no names) so the
# browser never talks to the Roster directly.
[[redirects]]
  from = "/api/impact"
  to = "https://roster.worththeirweight.org/api/public/impact"
  status = 200
  force = true

# Image assets were renamed to kebab-case (Nov 2026). Keep the old
# space-in-name URLs working for hotlinks in Zeffy, Candid, email
# signatures, and cached social cards. Netlify uses %20 for spaces.
[[redirects]]
  from = "/public/WTW%20Logo%20Main.png"
  to = "/public/wtw-logo-main.png"
  status = 301

[[redirects]]
  from = "/public/WTW%20Logo%20Black.png"
  to = "/public/wtw-logo-black.png"
  status = 301

[[redirects]]
  from = "/public/WTW%20Circle%20Avatar%20Gold.png"
  to = "/public/wtw-circle-avatar-gold.png"
  status = 301

[[redirects]]
  from = "/public/WTW%20Circle%20Avatar%20Black.png"
  to = "/public/wtw-circle-avatar-black.png"
  status = 301

# Security headers for every path. The CSP is built from what the pages
# actually load: our own scripts, styles and images, Google Fonts, and the
# Zeffy leaderboard/thermometer iframes on /carrytheweight. /api/impact is
# same-origin via the proxy above. Inline <style> blocks and style=""
# attributes exist on every page, so style-src keeps 'unsafe-inline'. There
# are no inline scripts (JSON-LD data blocks don't execute and are exempt).
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-src https://www.zeffy.com; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"

# Images, icons and the prep packet can be cached for a day. /shared/* (the
# header/footer partials, chrome.css, scripts) and HTML keep Netlify's
# default (max-age=0, must-revalidate with ETags) so edits show up on the
# next deploy.
[[headers]]
  for = "/public/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
