name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      # Scans the site's JS and inline <script> blocks in the HTML pages.
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          output: sarif
      - uses: actions/upload-artifact@v4
        with:
          name: report-codeql
          path: sarif/

  secrets:
    name: Secret detection (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz \
            | tar xz -C "$RUNNER_TEMP" gitleaks
      - name: Scan history
        run: $RUNNER_TEMP/gitleaks git . --redact --exit-code 0 --report-format json --report-path gitleaks.json
      - uses: actions/upload-artifact@v4
        with:
          name: report-gitleaks
          path: gitleaks.json
      - name: Fail on leaks
        run: |
          jq -r '.[] | "::error file=\(.File),line=\(.StartLine)::\(.RuleID) in commit \(.Commit[:7]) (fingerprint \(.Fingerprint))"' gitleaks.json
          n=$(jq length gitleaks.json)
          if [ "$n" -gt 0 ]; then echo "::error::gitleaks found $n potential secret(s)"; exit 1; fi

